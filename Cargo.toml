[workspace]
resolver = "2"
members = ["crates/agency-proto", "crates/agency-core", "crates/agency-adapters", "crates/agency-node"]

[workspace.package]
edition = "2021"
version = "0.5.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
# RS256 (Access) and ES256 (APNs), through aws-lc-rs (also the TLS provider of reqwest); no PEM parsing.
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
# P-256 device keys (ECDSA with SHA-256): the only curve some phones keep keys in hardware for.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "ecdh", "std", "getrandom"] }
# Web Push (RFC 8291): HKDF and AES-128-GCM, from the RustCrypto family p256 belongs to.
hkdf = "0.12"
aes-gcm = "0.11"
# Sending to several browsers at once, bounded: already in the tree through reqwest.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The operating system's random bytes.
getrandom = "0.4"
rust-embed = "8"
# http2: APNs accepts only HTTP/2.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
# no-serde-warnings: ts-rs cannot read `try_from`/`into`; those types state their TypeScript type with `#[ts(type)]`.
ts-rs = { version = "12", features = ["no-serde-warnings"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "fs", "process", "signal"] }
agency-proto = { path = "crates/agency-proto" }
agency-core = { path = "crates/agency-core" }
agency-adapters = { path = "crates/agency-adapters" }
