[workspace]
resolver = "2"
members = ["crates/agency-proto", "crates/agency-core", "crates/agency-adapters", "crates/agency-node"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
# RS256 only, through ring (already used by rustls); no PEM parsing.
jsonwebtoken = { version = "9", default-features = false }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rust-embed = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
# no-serde-warnings: ts-rs cannot read `try_from`/`into`; those types state their TypeScript type with `#[ts(type)]`.
ts-rs = { version = "12", features = ["no-serde-warnings"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "fs", "process", "signal"] }
agency-proto = { path = "crates/agency-proto" }
agency-core = { path = "crates/agency-core" }
agency-adapters = { path = "crates/agency-adapters" }
