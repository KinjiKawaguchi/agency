name: flaky-weekly

# Every Monday, the week's tests that passed only on a retry are posted as a comment on the standing issue
# (#265), so that CI's retries do not hide flakes for good. The list is read from the warnings CI puts on its
# runs (scripts/ci/flaky-summary.sh). Run it by hand from the Actions tab to post it at any time.
on:
  schedule:
    # Monday 00:00 UTC, which is 09:00 in Tokyo.
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Post the week's list
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/flaky-weekly.sh "${{ github.repository }}" 265
