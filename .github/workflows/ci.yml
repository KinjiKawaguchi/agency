name: ci

on:
  pull_request:
  push:
    branches: [main]
  # The merge queue tests a group of queued pull requests on top of main, and the nine required checks must
  # report for that group. Only this workflow listens to merge_group: the ones that write (release,
  # release-please) must not run for a group that has not merged yet.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A queued group is never cancelled by another run: the queue itself decides which groups to rebuild.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  # Conflict markers in Markdown build and pass every test, so they are checked on their own.
  conflict-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: scripts/check-conflict-markers.sh

  # A word the glossary rules out cannot come back in a screen's text.
  words:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: scripts/check-words.sh

  # An existing test vector never changes: signatures made over its bytes would stop being valid. The test in
  # agency-proto only compares the file with what the code generates, so this compares it with the base branch.
  # A push to main has nothing to compare with; a merge group compares with main.
  vectors-append-only:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: scripts/check-vectors-append-only.sh "origin/${GITHUB_BASE_REF:-main}"

  # A translated document must keep the sections of its English source.
  doc-translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: scripts/check-doc-translations.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      # A test that fails is run once more. One that then passes is a flake: the run stays green and the
      # summary below names it, so it is seen and not left to come back.
      - name: Run the tests
        env:
          FLAKY_REPORT: ${{ runner.temp }}/flaky-rust.txt
        run: scripts/ci/cargo-test-retry.sh --workspace --locked
      - name: Show the tests that passed only on a retry
        if: always()
        run: scripts/ci/flaky-summary.sh "${{ runner.temp }}/flaky-rust.txt"
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check that generated TypeScript bindings match the Rust types
        run: scripts/check-bindings.sh

  # The package behind the iPhone app (address validation and the navigation allow list) has no UIKit,
  # so it is tested on Linux. The app itself needs Xcode, and this repository has no macOS runner.
  apple-package:
    runs-on: ubuntu-latest
    container: swift:6.4
    defaults:
      run:
        working-directory: apple/AgencyKit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: swift test

  # The release scripts for the iPhone app, tested against stand-ins for Apple's API and for Xcode.
  apple-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the scripts
        run: shellcheck -x -P SCRIPTDIR apple/scripts/*.sh apple/scripts/lib/*.sh apple/scripts/test/run.sh apple/scripts/test/fakes/*
      - name: Test the scripts
        run: apple/scripts/test/run.sh

  # The Linux scripts: the systemd unit script, tested against paths that need quoting and verified by
  # systemd-analyze, and the scripts that build the release tarball. The macOS deploy and release scripts are
  # tested here too, against stand-ins, since no macOS job runs on GitHub's runners.
  linux-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test the script that posts the week's flaky tests
        run: |
          shellcheck -x scripts/ci/flaky-weekly.sh scripts/test/flaky-weekly.sh scripts/test/flaky-fakes/*
          scripts/test/flaky-weekly.sh
      - name: Check the scripts
        run: shellcheck -x scripts/ci/*.sh scripts/test/ci-scripts.sh scripts/test/ci-fakes/* scripts/systemd-unit.sh scripts/deploy-macos.sh scripts/release-macos.sh scripts/test/systemd-unit.sh scripts/test/debian-package.sh scripts/test/deploy-macos.sh scripts/test/release-macos.sh scripts/test/deploy-fakes/* scripts/test/release-fakes/* scripts/release/*.sh scripts/check-vectors-append-only.sh scripts/test/vectors-append-only.sh
      - name: Test the systemd unit script
        run: scripts/test/systemd-unit.sh
      - name: Test the Debian package script
        run: scripts/test/debian-package.sh
      - name: Check the release workflow makes the SBOMs and the signed checksums
        run: scripts/ci/check-release-workflow.sh
      - name: Test the release scripts that write the SBOMs and the checksums, and the check of the workflow
        run: |
          shellcheck -x scripts/test/sbom-and-checksums.sh scripts/test/release-workflow.sh scripts/test/sbom-fakes/*
          scripts/test/sbom-and-checksums.sh
          scripts/test/release-workflow.sh
      - name: Test the deploy script, against stand-ins for launchctl and curl
        run: scripts/test/deploy-macos.sh
      - name: Test the macOS release script and the packaging, against stand-ins for gh, cargo, and npm
        run: scripts/test/release-macos.sh
      - name: Test the scripts that show the tests that passed only on a retry
        run: scripts/test/ci-scripts.sh
      - name: Test the check that existing test vectors stay as they are
        run: scripts/test/vectors-append-only.sh
      - name: Test the check of a pull request's title
        run: |
          shellcheck -x scripts/test/pr-title.sh
          scripts/test/pr-title.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: web
        name: Check for the web client
        run: echo "present=$([ -f web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.web.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # On CI vitest runs a failing test twice more and writes down the ones that then pass (vitest.config.ts).
      - if: steps.web.outputs.present == 'true'
        working-directory: web
        env:
          FLAKY_REPORT: ${{ runner.temp }}/flaky-web.txt
        run: |
          corepack enable
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else npm ci; fi
          npm test
          npm run build
      - if: always() && steps.web.outputs.present == 'true'
        name: Show the tests that passed only on a retry
        run: scripts/ci/flaky-summary.sh "${{ runner.temp }}/flaky-web.txt"

  # Runs the built web client in headless Chromium against the mock node, and keeps a screenshot of
  # every screen (light and dark, desktop and phone width) as an artifact for reviewers.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: web
        name: Check for the web client
        run: echo "present=$([ -f web/e2e/screenshots.spec.ts ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.web.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: steps.web.outputs.present == 'true'
        name: Install dependencies
        working-directory: web
        run: npm ci
      - if: steps.web.outputs.present == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - if: steps.web.outputs.present == 'true'
        name: Install the headless browser
        working-directory: web
        run: npx playwright install --with-deps chromium-headless-shell
      - if: steps.web.outputs.present == 'true'
        name: Type-check the end-to-end tests
        working-directory: web
        run: npx tsc --noEmit -p e2e
      - if: steps.web.outputs.present == 'true'
        name: Run the end-to-end tests
        working-directory: web
        env:
          FLAKY_REPORT: ${{ runner.temp }}/flaky-e2e.txt
        run: npm run e2e
      - if: always() && steps.web.outputs.present == 'true'
        name: Show the tests that passed only on a retry
        run: scripts/ci/flaky-summary.sh "${{ runner.temp }}/flaky-e2e.txt"
      - if: always() && steps.web.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-screenshots
          path: web/e2e-screenshots
          if-no-files-found: warn
          retention-days: 14
      - if: failure() && steps.web.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-e2e-report
          path: |
            web/e2e-report
            web/e2e-results
          if-no-files-found: ignore
          retention-days: 14
