version: 2
updates:
  # Every GitHub Action in .github/workflows is pinned to a commit SHA, so a new release reaches CI
  # only through a pull request that Dependabot opens (it moves the SHA and the version comment together).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
