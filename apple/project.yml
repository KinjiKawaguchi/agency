name: Agency

options:
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

packages:
  AgencyKit:
    path: AgencyKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic

targets:
  Agency:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: AgencyKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Agency
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The app only uses HTTPS, which needs no export compliance paperwork.
        ITSAppUsesNonExemptEncryption: false
        # Lets a node on this device or the local network be opened over plain http.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
