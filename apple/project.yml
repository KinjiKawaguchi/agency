name: Agency

options:
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.4"
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

packages:
  AgencyKit:
    path: AgencyKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
  configs:
    # The APNs environment the build is signed for. Release builds, including TestFlight, use
    # production; builds run from Xcode use development (sandbox).
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production

targets:
  Agency:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: AgencyKit
        product: AgencyKit
      - package: AgencyKit
        product: AgencyProtocol
      - package: AgencyKit
        product: AgencyAPI
      - package: AgencyKit
        product: AgencyModel
      - package: AgencyKit
        product: AgencyUI
      - package: AgencyKit
        product: AgencyWidget
      # The widgets, embedded in the app.
      - target: AgencyWidgets
    entitlements:
      path: App/Agency.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        # The file the app writes for the widgets, which the widget extension reads. Both carry the same group:
        # the app's bundle ID with `group.` in front.
        com.apple.security.application-groups:
          - group.$(PRODUCT_BUNDLE_IDENTIFIER)
        # The node's host, for the universal link the Access sign-in returns through.
        com.apple.developer.associated-domains:
          - applinks:$(AGENCY_ASSOCIATED_HOST)
          - webcredentials:$(AGENCY_ASSOCIATED_HOST)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Agency
        # The languages of the alert strings (App/<language>.lproj/Localizable.strings).
        CFBundleLocalizations: [ja, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Read at run time to tell the node which APNs host a device token belongs to.
        AgencyAPNsEnvironment: $(APS_ENVIRONMENT)
        # The host the app is built to return to after an Access sign-in; the app uses that sign-in
        # only for a home node on this host.
        AgencyAssociatedHost: $(AGENCY_ASSOCIATED_HOST)
        # The app group the widgets' file lives in.
        AgencyAppGroup: group.$(PRODUCT_BUNDLE_IDENTIFIER)
        NSFaceIDUsageDescription: 決裁やコメントを送るとき、本人かどうかを Face ID で確認します。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The app only uses HTTPS, which needs no export compliance paperwork.
        ITSAppUsesNonExemptEncryption: false
        # Lets a node on this device or the local network be opened over plain http.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  AgencyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
    dependencies:
      # Only the widget's own code: a widget extension has a small memory limit, so it does not link the API
      # client or the signing code.
      - package: AgencyKit
        product: AgencyKit
      - package: AgencyKit
        product: AgencyWidget
    settings:
      base:
        # The app's bundle ID, with `.widgets`: an extension's must start with its app's.
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).widgets
        # An extension has no icon of its own, and runs on the phones the app does.
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
    entitlements:
      path: Widgets/AgencyWidgets.entitlements
      properties:
        # The app's group again: the extension's bundle ID without its `.widgets` suffix, with `group.` in front.
        com.apple.security.application-groups:
          - group.$(PRODUCT_BUNDLE_IDENTIFIER:base)
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: 決めること
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AgencyAppGroup: group.$(PRODUCT_BUNDLE_IDENTIFIER:base)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
