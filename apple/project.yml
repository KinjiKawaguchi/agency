name: Agency
options:
  developmentLanguage: ja
  deploymentTarget:
    iOS: '17.4'
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
packages:
  AgencyKit:
    path: AgencyKit
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production
targets:
  Agency:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: AgencyKit
        product: AgencyKit
      - package: AgencyKit
        product: AgencyProtocol
      - package: AgencyKit
        product: AgencyAPI
      - package: AgencyKit
        product: AgencyModel
      - package: AgencyKit
        product: AgencyUI
      - package: AgencyKit
        product: AgencyWidget
      - target: AgencyWidgets
      - target: AgencyNotificationService
    entitlements:
      path: App/Agency.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.security.application-groups:
          - group.$(PRODUCT_BUNDLE_IDENTIFIER)
        com.apple.developer.associated-domains:
          - applinks:$(AGENCY_ASSOCIATED_HOST)
          - applinks:$(AGENCY_ASSOCIATED_HOST_2)
          - webcredentials:$(AGENCY_ASSOCIATED_HOST)
          - webcredentials:$(AGENCY_ASSOCIATED_HOST_2)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Agency
        CFBundleLocalizations:
          - ja
          - en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AgencyAPNsEnvironment: $(APS_ENVIRONMENT)
        AgencyAssociatedHost: $(AGENCY_ASSOCIATED_HOST)
        AgencyAssociatedHosts: $(AGENCY_ASSOCIATED_HOST) $(AGENCY_ASSOCIATED_HOST_2)
        AgencyBuildCommit: $(AGENCY_BUILD_COMMIT)
        AgencyBuildDescribe: $(AGENCY_BUILD_DESCRIBE)
        AgencyAppGroup: group.$(PRODUCT_BUNDLE_IDENTIFIER)
        NSFaceIDUsageDescription: 決裁やコメントを送るとき、本人かどうかを Face ID で確認します。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - remote-notification
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).outbox
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  AgencyMac:
    type: application
    platform: macOS
    deploymentTarget: '14.4'
    sources:
      - Mac
      - Shared
    dependencies:
      - package: AgencyKit
        product: AgencyKit
      - package: AgencyKit
        product: AgencyProtocol
      - package: AgencyKit
        product: AgencyAPI
      - package: AgencyKit
        product: AgencyModel
      - package: AgencyKit
        product: AgencyUI
      - package: AgencyKit
        product: AgencyWidget
    settings:
      base:
        PRODUCT_NAME: Agency
        ENABLE_HARDENED_RUNTIME: 'YES'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: 'YES'
    entitlements:
      path: Mac/Agency.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.associated-domains:
          - applinks:$(AGENCY_ASSOCIATED_HOST)
          - applinks:$(AGENCY_ASSOCIATED_HOST_2)
          - webcredentials:$(AGENCY_ASSOCIATED_HOST)
          - webcredentials:$(AGENCY_ASSOCIATED_HOST_2)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Agency
        CFBundleLocalizations:
          - ja
          - en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        AgencyAPNsEnvironment: $(APS_ENVIRONMENT)
        AgencyAssociatedHost: $(AGENCY_ASSOCIATED_HOST)
        AgencyAssociatedHosts: $(AGENCY_ASSOCIATED_HOST) $(AGENCY_ASSOCIATED_HOST_2)
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  AgencyNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - NotificationService
    dependencies:
      - package: AgencyKit
        product: AgencyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).notifications
        TARGETED_DEVICE_FAMILY: '1'
        SKIP_INSTALL: 'YES'
    entitlements:
      path: NotificationService/AgencyNotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(PRODUCT_BUNDLE_IDENTIFIER:base)
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: 決めること
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AgencyAppGroup: group.$(PRODUCT_BUNDLE_IDENTIFIER:base)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  AgencyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
    dependencies:
      - package: AgencyKit
        product: AgencyKit
      - package: AgencyKit
        product: AgencyWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).widgets
        TARGETED_DEVICE_FAMILY: '1'
        SKIP_INSTALL: 'YES'
    entitlements:
      path: Widgets/AgencyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(PRODUCT_BUNDLE_IDENTIFIER:base)
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: 決めること
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AgencyAppGroup: group.$(PRODUCT_BUNDLE_IDENTIFIER:base)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
