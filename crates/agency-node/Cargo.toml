[package]
name = "agency-node"
description = "Agency's node, one per machine: serves its teams and the web client, accepts signed decisions, and keeps replicas of other nodes and an outbox"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "agency_node"
path = "src/lib.rs"

[[bin]]
name = "agency"
path = "src/main.rs"

[dependencies]
agency-adapters.workspace = true
agency-core.workspace = true
agency-proto.workspace = true
anyhow.workspace = true
axum.workspace = true
# The recovery key's 24 words: the BIP-39 English list with its checksum.
bip39 = { version = "2.1", default-features = false, features = ["std"] }
clap.workspace = true
futures-util.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
async-trait.workspace = true
base64.workspace = true
sha2.workspace = true
p256.workspace = true
jsonwebtoken.workspace = true
tower = { version = "0.5", features = ["util"] }
reqwest.workspace = true
tempfile.workspace = true
