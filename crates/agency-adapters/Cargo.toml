[package]
name = "agency-adapters"
description = "Adapters for agency-core's ports: files, HTTP in and out, team runtime commands, the system clock and randomness, and in-memory test doubles."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agency-core.workspace = true
aes-gcm.workspace = true
agency-proto.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
futures-util.workspace = true
hkdf.workspace = true
jsonwebtoken.workspace = true
p256.workspace = true
rand_core.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The macOS keychain and the owner's presence (Touch ID or the login password) for root keys.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }
